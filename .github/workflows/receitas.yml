# Robô das RECEITAS do Link Edit: a cada 6 h refaz as listas salvas em receitas/receitas.json
# (lê as listas de origem, testa os canais, tira os mortos, a reserva viva assume) e publica em listas/<id>.m3u e .json
name: Link Edit — receitas

on:
  schedule:
    - cron: "41 */6 * * *"      # 4x por dia (fora da hora cheia, para não pegar fila)
  push:
    branches: [main]
    paths:
      - "receitas/receitas.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedit-receitas
  cancel-in-progress: false

jobs:
  receitas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refazer as receitas
        run: |
          if [ ! -f receitas/receitas.json ]; then echo "Sem receitas ainda."; exit 0; fi
          node tools/receitas.mjs --max 4000

      - name: Publicar
        run: |
          git config user.name "cartoonzine-robo"
          git config user.email "robo@users.noreply.github.com"
          git add listas receitas/estado.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "receitas: listas atualizadas"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
