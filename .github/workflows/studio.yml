# Robô do Cartoonzine Studio
#  - a cada mudança em conteudo/ (painel, push, upload pelo site do GitHub): gera os DBs em dist/
#  - todo dia: puxa as fontes automáticas (automatico/fontes.json) e testa links
#  - botão "Run workflow": faz tudo na hora
name: Studio — gerar DBs

on:
  push:
    branches: [main]
    paths:
      - "conteudo/**"
      - "automatico/**"
      - "studio.config.json"
      - "core/**"
      - "tools/**"
  schedule:
    - cron: "17 8 * * *"        # 05:17 em Brasília (depois que a cota do YouTube zera, à meia-noite do Pacífico)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes do núcleo
        run: node --test test/*.test.mjs

      - name: Fontes automáticas
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/sincronizar.mjs

      - name: Completar sinopses, capas, episódios e notas (TMDB / IMDb)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          node tools/completar.mjs --limite 150
          # aos domingos, atualiza as notas do IMDb de tudo (o plano grátis do OMDb aceita 1000 por dia)
          if [ "$(date +%u)" = "7" ]; then node tools/completar.mjs --notas --limite 800; fi

      - name: Testar links (os mais antigos primeiro)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node tools/verificar-links.mjs --limite 1500

      - name: Gerar DBs
        run: node tools/build.mjs

      - name: Publicar se mudou
        run: |
          git config user.name  "cartoonzine-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "studio: DBs atualizados"
          # o painel pode ter commitado enquanto o build rodava: junta e tenta de novo
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
